AWSTemplateFormatVersion: "2010-09-09"
Description: "Stack 4 - Automatización y Escalabilidad Programada (Scheduled Actions + LT v2)"

# ─────────────────────────────────────────────
# PARÁMETROS
# ─────────────────────────────────────────────
Parameters:
  Stack3Name:
    Type: String
    Description: "Nombre exacto del Stack 3 (para importar sus Outputs)"
    Default: "stack3-alb-asg-Juan-Garcia"

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t2.micro, t2.small, t3.micro, t3.small]
    Description: "Tipo de instancia para el Launch Template v2"

  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2
    Description: "AMI de Amazon Linux 2"

  # ── Horarios de escala (cron en UTC) ──────────────────────────────────────
  # Incremento 1: lunes-viernes a las 07:00 UTC (inicio de jornada)
  ScaleUpCron1:
    Type: String
    Default: "0 7 * * 1-5"
    Description: "Cron de incremento 1 (UTC). Default: lun-vie 07:00 UTC"

  # Incremento 2: lunes-viernes a las 12:00 UTC (hora pico mediodía)
  ScaleUpCron2:
    Type: String
    Default: "0 12 * * 1-5"
    Description: "Cron de incremento 2 (UTC). Default: lun-vie 12:00 UTC"

  # Reducción 1: lunes-viernes a las 14:00 UTC (post-pico mediodía)
  ScaleDownCron1:
    Type: String
    Default: "0 14 * * 1-5"
    Description: "Cron de reducción 1 (UTC). Default: lun-vie 14:00 UTC"

  # Reducción 2: lunes-viernes a las 20:00 UTC (fin de jornada)
  ScaleDownCron2:
    Type: String
    Default: "0 20 * * 1-5"
    Description: "Cron de reducción 2 (UTC). Default: lun-vie 20:00 UTC"

  # ── Capacidades ──────────────────────────────────────────────────────────
  PeakDesired:
    Type: Number
    Default: 4
    Description: "Capacidad deseada en hora pico"

  PeakMax:
    Type: Number
    Default: 6
    Description: "Capacidad máxima en hora pico"

  PeakMin:
    Type: Number
    Default: 2
    Description: "Capacidad mínima en hora pico"

  OffPeakDesired:
    Type: Number
    Default: 1
    Description: "Capacidad deseada fuera de hora pico"

  OffPeakMax:
    Type: Number
    Default: 2
    Description: "Capacidad máxima fuera de hora pico"

  OffPeakMin:
    Type: Number
    Default: 1
    Description: "Capacidad mínima fuera de hora pico"

# ─────────────────────────────────────────────
# RECURSOS
# ─────────────────────────────────────────────
Resources:

  # ── Launch Template v2 ──────────────────────
  # Crea una NUEVA versión del mismo Launch Template del Stack 3.
  # Usa !ImportValue para obtener el ID del LT existente y crear la v2.
  LaunchTemplateV2:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      # Mismo nombre que el del Stack 3 → crea una segunda versión
      LaunchTemplateName: !Sub
        - "${Stack3LT}"
        - Stack3LT: !ImportValue
            !Sub "${Stack3Name}-lt-id"   # nombre exportado del Stack 3

      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType   # t2.small en lugar de t2.micro
        # UserData actualizado para la v2
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            yum update -y
            yum install -y httpd
            systemctl start httpd
            systemctl enable httpd

            TOKEN=$(curl -sX PUT "http://169.254.169.254/latest/api/token" \
              -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
            INSTANCE_ID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/instance-id)
            AZ=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/placement/availability-zone)

            cat > /var/www/html/index.html <<EOF
            <!DOCTYPE html>
            <html lang="es">
            <head>
              <meta charset="UTF-8">
              <title>Stack 4 - Automatización v2</title>
              <style>
                body { font-family: Arial, sans-serif; background: #eaf4ff;
                       display: flex; align-items: center; justify-content: center;
                       height: 100vh; margin: 0; }
                .card { background: #fff; border-radius: 12px; padding: 40px 60px;
                        box-shadow: 0 4px 24px rgba(0,0,0,0.10); text-align: center; }
                h1 { color: #146eb4; margin-bottom: 8px; }
                p  { color: #5f6b7a; margin: 6px 0; font-size: 1.05rem; }
                .badge-v2 { display: inline-block; background: #146eb4; color: #fff;
                            border-radius: 6px; padding: 4px 16px; margin-top: 16px;
                            font-weight: bold; font-size: 0.95rem; }
              </style>
            </head>
            <body>
              <div class="card">
                <h1>&#128640; Instancia v2 activa</h1>
                <p><strong>Instance ID:</strong> $INSTANCE_ID</p>
                <p><strong>Availability Zone:</strong> $AZ</p>
                <p><strong>Stack:</strong> ${AWS::StackName}</p>
                <div class="badge-v2">Launch Template v2 | t2.small</div>
              </div>
            </body>
            </html>
            EOF

        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "${Stack3Name}-instance-v2"
              - Key: LaunchTemplateVersion
                Value: "2"

  # ── Actualización del ASG para usar LT v2 ───
  # CloudFormation no puede hacer "UpdateAutoScalingGroup" directamente,
  # se usa un Custom Resource (Lambda inline) para actualizar el ASG
  # con la nueva versión del Launch Template.
  #
  # ALTERNATIVA SIMPLE: si lo ejecutas después de que el Stack 3 ya existe,
  # el siguiente recurso SSM Parameter + script es suficiente para evidencia.
  # La forma recomendada en AWS es usar un update directo por CLI o console;
  # para CloudFormation se añade el parámetro InstanceRefreshEnabled.
  #
  # ─────────────────────────────────────────
  # NOTA: Para actualizar el ASG a LT v2, ejecuta en tu terminal:
  #
  #   aws autoscaling update-auto-scaling-group \
  #     --auto-scaling-group-name <nombre-asg-del-stack3> \
  #     --launch-template LaunchTemplateId=<lt-id>,Version=2
  #
  # O usa el recurso UpdateASGParam de abajo como disparo de evidencia.
  # ─────────────────────────────────────────

  # Parámetro SSM que registra la versión activa del LT en el ASG
  ASGLaunchTemplateVersionParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/stacks/${Stack3Name}/asg-lt-version"
      Type: String
      Value: "2"
      Description: "Versión del Launch Template activa en el ASG"

  # ── Scheduled Actions ────────────────────────

  # Incremento 1: inicio de jornada laboral
  ScaleUpAction1:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !ImportValue
        !Sub "${Stack3Name}-asg-name"
      DesiredCapacity: !Ref PeakDesired
      MaxSize: !Ref PeakMax
      MinSize: !Ref PeakMin
      Recurrence: !Ref ScaleUpCron1

  # Incremento 2: hora pico del mediodía
  ScaleUpAction2:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !ImportValue
        !Sub "${Stack3Name}-asg-name"
      DesiredCapacity: !Ref PeakMax
      MaxSize: !Ref PeakMax
      MinSize: !Ref PeakMin
      Recurrence: !Ref ScaleUpCron2

  # Reducción 1: post-pico del mediodía
  ScaleDownAction1:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !ImportValue
        !Sub "${Stack3Name}-asg-name"
      DesiredCapacity: !Ref PeakDesired
      MaxSize: !Ref PeakMax
      MinSize: !Ref OffPeakMin
      Recurrence: !Ref ScaleDownCron1

  # Reducción 2: fin de jornada laboral
  ScaleDownAction2:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !ImportValue
        !Sub "${Stack3Name}-asg-name"
      DesiredCapacity: !Ref OffPeakDesired
      MaxSize: !Ref OffPeakMax
      MinSize: !Ref OffPeakMin
      Recurrence: !Ref ScaleDownCron2

# ─────────────────────────────────────────────
# OUTPUTS
# ─────────────────────────────────────────────
Outputs:
  LaunchTemplateV2Id:
    Description: "ID del Launch Template (v2 creada)"
    Value: !Ref LaunchTemplateV2
    Export:
      Name: !Sub "${AWS::StackName}-lt-v2-id"

  LaunchTemplateV2Version:
    Description: "Versión del Launch Template v2"
    Value: !GetAtt LaunchTemplateV2.LatestVersionNumber
    Export:
      Name: !Sub "${AWS::StackName}-lt-v2-version"

  ScaleUpAction1Arn:
    Description: "ARN de Scheduled Action - Incremento 1 (inicio de jornada)"
    Value: !Ref ScaleUpAction1

  ScaleUpAction2Arn:
    Description: "ARN de Scheduled Action - Incremento 2 (hora pico)"
    Value: !Ref ScaleUpAction2

  ScaleDownAction1Arn:
    Description: "ARN de Scheduled Action - Reducción 1 (post-pico)"
    Value: !Ref ScaleDownAction1

  ScaleDownAction2Arn:
    Description: "ARN de Scheduled Action - Reducción 2 (fin de jornada)"
    Value: !Ref ScaleDownAction2

  UpdateASGCommand:
    Description: "Comando CLI para actualizar el ASG a LT v2"
    Value: !Sub
      - "aws autoscaling update-auto-scaling-group --auto-scaling-group-name ${ASGName} --launch-template LaunchTemplateId=${LTId},Version=2"
      - ASGName: !ImportValue
          !Sub "${Stack3Name}-asg-name"
        LTId: !ImportValue
          !Sub "${Stack3Name}-lt-id"