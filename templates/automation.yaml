AWSTemplateFormatVersion: "2010-09-09"
Description: "Stack 4 - Automatización y Escalabilidad Programada (Scheduled Actions + LT v2)"

# ─────────────────────────────────────────────
# PARÁMETROS
# ─────────────────────────────────────────────
Parameters:
  Stack3Name:
    Type: String
    Description: "Nombre exacto del Stack 3 (para importar sus Outputs)"
    Default: "ALB-ASG-Meza-Torres"

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t2.micro, t2.small, t3.micro, t3.small]
    Description: "Tipo de instancia para el Launch Template v2"

  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2
    Description: "AMI de Amazon Linux 2"

  ScaleUpCron1:
    Type: String
    Default: "0 7 * * 1-5"
    Description: "Cron incremento 1 (UTC). Default: lun-vie 07:00 UTC"

  ScaleUpCron2:
    Type: String
    Default: "0 12 * * 1-5"
    Description: "Cron incremento 2 (UTC). Default: lun-vie 12:00 UTC"

  ScaleDownCron1:
    Type: String
    Default: "0 14 * * 1-5"
    Description: "Cron reducción 1 (UTC). Default: lun-vie 14:00 UTC"

  ScaleDownCron2:
    Type: String
    Default: "0 20 * * 1-5"
    Description: "Cron reducción 2 (UTC). Default: lun-vie 20:00 UTC"

  PeakDesired:
    Type: Number
    Default: 4
    Description: "Capacidad deseada en hora pico"

  PeakMax:
    Type: Number
    Default: 6
    Description: "Capacidad máxima en hora pico"

  PeakMin:
    Type: Number
    Default: 2
    Description: "Capacidad mínima en hora pico"

  OffPeakDesired:
    Type: Number
    Default: 1
    Description: "Capacidad deseada fuera de hora pico"

  OffPeakMax:
    Type: Number
    Default: 2
    Description: "Capacidad máxima fuera de hora pico"

  OffPeakMin:
    Type: Number
    Default: 1
    Description: "Capacidad mínima fuera de hora pico"

# ─────────────────────────────────────────────
# RECURSOS
# ─────────────────────────────────────────────
Resources:

  # ── Launch Template v2 ──────────────────────
  # Se crea con nombre PROPIO (no reutiliza el del Stack 3).
  # El Stack 3 exporta el SG de instancias para que este LT
  # pueda adjuntarlo sin duplicar reglas.
  LaunchTemplateV2:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${AWS::StackName}-lt-v2"
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        SecurityGroupIds:
          - !ImportValue !Sub "${Stack3Name}-instance-sg-id"
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            yum update -y
            yum install -y httpd
            systemctl start httpd
            systemctl enable httpd

            TOKEN=$(curl -sX PUT "http://169.254.169.254/latest/api/token" \
              -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
            INSTANCE_ID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/instance-id)
            AZ=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/placement/availability-zone)

            cat > /var/www/html/index.html <<EOF
            <!DOCTYPE html>
            <html lang="es">
            <head>
              <meta charset="UTF-8">
              <title>Stack 4 - Automatización v2</title>
              <style>
                body { font-family: Arial, sans-serif; background: #eaf4ff;
                       display: flex; align-items: center; justify-content: center;
                       height: 100vh; margin: 0; }
                .card { background: #fff; border-radius: 12px; padding: 40px 60px;
                        box-shadow: 0 4px 24px rgba(0,0,0,0.10); text-align: center; }
                h1 { color: #146eb4; margin-bottom: 8px; }
                p  { color: #5f6b7a; margin: 6px 0; font-size: 1.05rem; }
                .badge-v2 { display: inline-block; background: #146eb4; color: #fff;
                            border-radius: 6px; padding: 4px 16px; margin-top: 16px;
                            font-weight: bold; font-size: 0.95rem; }
              </style>
            </head>
            <body>
              <div class="card">
                <h1>&#128640; Instancia v2 activa</h1>
                <p><strong>Instance ID:</strong> $INSTANCE_ID</p>
                <p><strong>Availability Zone:</strong> $AZ</p>
                <p><strong>Stack:</strong> ${AWS::StackName}</p>
                <div class="badge-v2">Launch Template v2 | ${InstanceType}</div>
              </div>
            </body>
            </html>
            EOF

        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "${AWS::StackName}-instance-v2"
              - Key: LaunchTemplateVersion
                Value: "2"

  # ── Parámetro SSM de evidencia ───────────────
  ASGLaunchTemplateVersionParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/stacks/${Stack3Name}/asg-lt-version"
      Type: String
      Value: "2"
      Description: "Versión del Launch Template activa en el ASG"

  # ── Scheduled Actions ────────────────────────

  ScaleUpAction1:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !ImportValue !Sub "${Stack3Name}-asg-name"
      DesiredCapacity: !Ref PeakDesired
      MaxSize: !Ref PeakMax
      MinSize: !Ref PeakMin
      Recurrence: !Ref ScaleUpCron1

  ScaleUpAction2:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !ImportValue !Sub "${Stack3Name}-asg-name"
      DesiredCapacity: !Ref PeakMax
      MaxSize: !Ref PeakMax
      MinSize: !Ref PeakMin
      Recurrence: !Ref ScaleUpCron2

  ScaleDownAction1:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !ImportValue !Sub "${Stack3Name}-asg-name"
      DesiredCapacity: !Ref PeakDesired
      MaxSize: !Ref PeakMax
      MinSize: !Ref OffPeakMin
      Recurrence: !Ref ScaleDownCron1

  ScaleDownAction2:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !ImportValue !Sub "${Stack3Name}-asg-name"
      DesiredCapacity: !Ref OffPeakDesired
      MaxSize: !Ref OffPeakMax
      MinSize: !Ref OffPeakMin
      Recurrence: !Ref ScaleDownCron2

# ─────────────────────────────────────────────
# OUTPUTS
# ─────────────────────────────────────────────
Outputs:
  LaunchTemplateV2Id:
    Description: "ID del Launch Template v2"
    Value: !Ref LaunchTemplateV2
    Export:
      Name: !Sub "${AWS::StackName}-lt-v2-id"

  LaunchTemplateV2Version:
    Description: "Última versión del Launch Template v2"
    Value: !GetAtt LaunchTemplateV2.LatestVersionNumber
    Export:
      Name: !Sub "${AWS::StackName}-lt-v2-version"

  ScaleUpAction1Arn:
    Description: "Scheduled Action - Incremento 1 (inicio de jornada)"
    Value: !Ref ScaleUpAction1

  ScaleUpAction2Arn:
    Description: "Scheduled Action - Incremento 2 (hora pico)"
    Value: !Ref ScaleUpAction2

  ScaleDownAction1Arn:
    Description: "Scheduled Action - Reducción 1 (post-pico)"
    Value: !Ref ScaleDownAction1

  ScaleDownAction2Arn:
    Description: "Scheduled Action - Reducción 2 (fin de jornada)"
    Value: !Ref ScaleDownAction2

  UpdateASGCommand:
    Description: "Comando CLI para apuntar el ASG al LT v2"
    Value: !Sub
      - "aws autoscaling update-auto-scaling-group --auto-scaling-group-name ${ASGName} --launch-template LaunchTemplateId=${LTV2Id},Version=$Latest"
      - ASGName: !ImportValue !Sub "${Stack3Name}-asg-name"
        LTV2Id: !Ref LaunchTemplateV2