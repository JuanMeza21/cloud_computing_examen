AWSTemplateFormatVersion: "2010-09-09"
Description: "Stack 4 - Automatización y Escalabilidad Programada (Scheduled Actions + LT v2)"

# ─────────────────────────────────────────────
# PARÁMETROS
# ─────────────────────────────────────────────
Parameters:
  Stack3Name:
    Type: String
    Default: "stack3-alb-asg-Juan-Garcia"
    Description: "Nombre exacto del Stack 3 (para importar sus Outputs)"

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t2.micro, t2.small, t3.micro, t3.small]

  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2

  ScaleUpCron1:
    Type: String
    Default: "0 7 * * 1-5"

  ScaleUpCron2:
    Type: String
    Default: "0 12 * * 1-5"

  ScaleDownCron1:
    Type: String
    Default: "0 14 * * 1-5"

  ScaleDownCron2:
    Type: String
    Default: "0 20 * * 1-5"

  PeakDesired:
    Type: Number
    Default: 4

  PeakMax:
    Type: Number
    Default: 6

  PeakMin:
    Type: Number
    Default: 2

  OffPeakDesired:
    Type: Number
    Default: 1

  OffPeakMax:
    Type: Number
    Default: 2

  OffPeakMin:
    Type: Number
    Default: 1

# ─────────────────────────────────────────────
# RESOURCES
# ─────────────────────────────────────────────
Resources:

  # ── Launch Template v2 (crea nueva versión) ──
  LaunchTemplateV2:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateId: !ImportValue
        Fn::Sub: "${Stack3Name}-lt-id"

      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType

        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            yum update -y
            yum install -y httpd
            systemctl start httpd
            systemctl enable httpd

            TOKEN=$(curl -sX PUT "http://169.254.169.254/latest/api/token" \
              -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")

            INSTANCE_ID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/instance-id)

            AZ=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.169/latest/meta-data/placement/availability-zone)

            cat > /var/www/html/index.html <<EOF
            <html>
            <body>
              <h1>Instancia v2 activa 🚀</h1>
              <p>Instance ID: $INSTANCE_ID</p>
              <p>AZ: $AZ</p>
              <p>Stack: ${AWS::StackName}</p>
            </body>
            </html>
            EOF

        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "${Stack3Name}-instance-v2"

  # ── SSM tracking version ──
  ASGLaunchTemplateVersionParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/stacks/${Stack3Name}/asg-lt-version"
      Type: String
      Value: "2"

  # ── Scheduled Actions ──

  ScaleUpAction1:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !ImportValue
        Fn::Sub: "${Stack3Name}-asg-name"
      DesiredCapacity: !Ref PeakDesired
      MaxSize: !Ref PeakMax
      MinSize: !Ref PeakMin
      Recurrence: !Ref ScaleUpCron1

  ScaleUpAction2:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !ImportValue
        Fn::Sub: "${Stack3Name}-asg-name"
      DesiredCapacity: !Ref PeakMax
      MaxSize: !Ref PeakMax
      MinSize: !Ref PeakMin
      Recurrence: !Ref ScaleUpCron2

  ScaleDownAction1:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !ImportValue
        Fn::Sub: "${Stack3Name}-asg-name"
      DesiredCapacity: !Ref PeakDesired
      MaxSize: !Ref PeakMax
      MinSize: !Ref OffPeakMin
      Recurrence: !Ref ScaleDownCron1

  ScaleDownAction2:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !ImportValue
        Fn::Sub: "${Stack3Name}-asg-name"
      DesiredCapacity: !Ref OffPeakDesired
      MaxSize: !Ref OffPeakMax
      MinSize: !Ref OffPeakMin
      Recurrence: !Ref ScaleDownCron2

# ─────────────────────────────────────────────
# OUTPUTS
# ─────────────────────────────────────────────
Outputs:

  LaunchTemplateV2Id:
    Value: !Ref LaunchTemplateV2

  LaunchTemplateV2Version:
    Value: !GetAtt LaunchTemplateV2.LatestVersionNumber

  ScaleUpAction1Arn:
    Value: !Ref ScaleUpAction1

  ScaleUpAction2Arn:
    Value: !Ref ScaleUpAction2

  ScaleDownAction1Arn:
    Value: !Ref ScaleDownAction1

  ScaleDownAction2Arn:
    Value: !Ref ScaleDownAction2

  UpdateASGCommand:
    Value: !Sub
      - "aws autoscaling update-auto-scaling-group --auto-scaling-group-name ${ASGName} --launch-template LaunchTemplateId=${LTId},Version=2"
      - ASGName: !ImportValue
          Fn::Sub: "${Stack3Name}-asg-name"
        LTId: !ImportValue
          Fn::Sub: "${Stack3Name}-lt-id"